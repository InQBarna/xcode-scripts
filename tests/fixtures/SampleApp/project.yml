# Tiny iOS app used by tests/smoke.sh. The .xcodeproj is generated with XcodeGen (brew install xcodegen).
name: SampleApp
options:
  bundleIdPrefix: com.inqbarna.smoke
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SampleApp:
    type: application
    platform: iOS
    sources: [SampleApp]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SampleAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SampleAppTests]
    dependencies:
      - target: SampleApp
  SampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SampleAppUITests]
    dependencies:
      - target: SampleApp
schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
    test:
      gatherCoverageData: true
      coverageTargets: [SampleApp]
      targets: [SampleAppTests, SampleAppUITests]
