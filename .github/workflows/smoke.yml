# End-to-end test (tests/smoke.sh): generates a sample iOS project, runs the generator on it, then
# build / tests / warnings / coverage / doctor. Slow (macOS + simulator), so it only runs when something
# that ends up in generated projects, or the test itself, changes.
name: Smoke test

on:
  pull_request:
    paths: &paths
      - create_setup_build_scripts.sh
      - fastlane/**
      - templates/**
      - samples/**
      - xcinstall/**
      - tests/**
      - versions.env
      - .github/workflows/smoke.yml
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    # Fast: portal and lint lanes with stubs (tests/lanes.sh)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: tests/lanes.sh

  smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: tests/smoke.sh
