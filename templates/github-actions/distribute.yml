# Sends a version to Firebase App Distribution or TestFlight. Run it manually from the Actions tab.
# Generated by https://github.com/InQBarna/xcode-scripts. Calls the `firebase` / `ship_testflight` lanes of your Fastfile.
#
# Repository secrets needed:
#   MATCH_PASSPHRASE                  passphrase of the match repo
#   MATCH_GIT_BASIC_AUTHORIZATION     base64 of "user:personal_access_token" with read access to the match repo
#   ASC_KEY_ID, ASC_ISSUER_ID         App Store Connect API key ids
#   ASC_KEY_P8                        content of the AuthKey_XXXX.p8 file
#   FIREBASE_TOKEN                    (firebase only) from `firebase login:ci`
name: Distribute

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to send the build
        type: choice
        options: [firebase, testflight]
        default: firebase

# The lanes push a git tag per distributed build
permissions:
  contents: write

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MATCH_PASSPHRASE: ${{ secrets.MATCH_PASSPHRASE }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changelog is built from the git tags of previous builds

      - name: Git identity (the lanes commit the version bump)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Send to Firebase App Distribution
        if: inputs.target == 'firebase'
        run: bundle exec fastlane firebase

      - name: Send to TestFlight
        if: inputs.target == 'testflight'
        run: bundle exec fastlane ship_testflight
