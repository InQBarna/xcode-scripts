# Builds the app (0 warnings) and runs the tests on every pull request and push to the main branch.
# Generated by https://github.com/InQBarna/xcode-scripts. Calls the same fastlane lanes as ./scripts/build.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Uncomment to select a specific Xcode (must be installed on the runner image, see
  # https://github.com/actions/runner-images), e.g. "16.2". Default: the runner's default Xcode.
  # XCODE_VERSION: "16.2"
  # Uncomment to pin the simulator (default: newest installed iOS runtime and iPhone)
  # RUNTIME: "18.2"
  # DEVICE: "iPhone 16"
  MAX_WARNINGS: "0"

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: env.XCODE_VERSION != ''
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      # Ruby version comes from .ruby-version (created by scripts/setup.sh), gems from the Gemfile.
      # Commit Gemfile.lock so the gems are cached.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and test
        run: bundle exec fastlane test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            coverage/cobertura.xml
            fastlane/test_output/
            fastlane/test_output_ui/
